name: CI

on:
  push:
    branches: [main]
    # A version tag (`v0.2.0`) also publishes a GitHub release, which the
    # app's update check (Help > Check for updates) reads.
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions > CI > Run workflow) to get a Windows or Linux build of any branch.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace tests and clippy build every crate, among them the app
      # (winit, cpal) and the plugin (baseview), which link the system's X11,
      # Wayland and ALSA libraries.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libx11-dev libxcb1-dev libx11-xcb-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The audit's errors (crate graph, names, `#[allow]`); its warnings are measures.
      - run: cargo xtask audit --no-clippy
      # THIRD-PARTY-LICENSES.txt is generated and committed (DEVELOPMENT.md, "Licenses").
      - name: Third-party licenses are up to date
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-about --features cli
          cargo about generate --all-features --workspace about.hbs -o /tmp/third-party.txt
          # The license files of some crates are CRLF: only the text counts, not the line endings.
          diff --strip-trailing-cr THIRD-PARTY-LICENSES.txt /tmp/third-party.txt
      - run: cargo test --workspace

  # The plugin bundles (`assets/` inside), checked by the CLAP project's
  # validator. Built for a release tag only, or when the workflow is run by hand.
  # The CLAP is built first without `vst3`, so that the one shipped in the
  # release stays MIT (README.md, "License"); the VST3 build is GPLv3: its bundle
  # alone is zipped and shipped as a separate download, never the `.clap` that
  # build also leaves in `target/bundled`.
  plugin:
    name: plugin (${{ matrix.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libx11-dev libxcb1-dev libx11-xcb-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - run: cargo xtask bundle ordrumbox-plugin --release
      # 0.3.2 no longer builds: its lockfile pins `time` 0.3.20, which recent
      # rustc rejects. The workflow's `-D warnings` is for this repository's
      # code: a warning in the validator's own code must not fail its build.
      - run: cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
        env:
          RUSTFLAGS: ""
      # The excluded tests fail in nih-plug's CLAP wrapper, not in this plugin:
      # its state load reserves the length read from the stream unchecked
      # (random bytes abort on the allocation), and does not ask the host to
      # rescan the parameter values afterwards.
      - run: clap-validator validate --exclude 'state-invalid-random|state-reproducibility' target/bundled/orDrumbox.clap
      # The CLAP of the release. On Windows and Linux it is a single file, which
      # reads the `assets/` next to it: the zips put it beside the program.
      # On macOS it is a bundle, `assets/` inside, zipped by `ditto` to keep its
      # signature and the binary's permissions.
      - name: CLAP of the release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir clap && cp target/bundled/orDrumbox.clap clap/
      - name: CLAP of the release (Linux)
        if: runner.os == 'Linux'
        run: mkdir clap && cp target/bundled/orDrumbox.clap clap/
      - name: CLAP of the release (macOS)
        if: runner.os == 'macOS'
        run: mkdir clap && ditto -c -k --norsrc --noextattr --noacl --keepParent target/bundled/orDrumbox.clap clap/orDrumbox.clap.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-clap-${{ runner.os }}
          path: clap
      - run: cargo xtask bundle ordrumbox-plugin --release --features vst3
      # The VST3 of the release (GPLv3): a bundle on every system, `assets/` inside.
      # `ditto` on macOS keeps its signature and the binary's permissions.
      - name: VST3 of the release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory vst3 | Out-Null
          Copy-Item LICENSE, LICENSE-GPL-3.0, THIRD-PARTY-LICENSES.txt, installer/vst3-NOTICE.txt target/bundled/
          Compress-Archive -Path target/bundled/orDrumbox.vst3, target/bundled/LICENSE, target/bundled/LICENSE-GPL-3.0, target/bundled/THIRD-PARTY-LICENSES.txt, target/bundled/vst3-NOTICE.txt -DestinationPath vst3/orDrumbox.vst3.zip
      - name: VST3 of the release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir vst3
          cp LICENSE LICENSE-GPL-3.0 THIRD-PARTY-LICENSES.txt installer/vst3-NOTICE.txt target/bundled/
          (cd target/bundled && zip -r ../../vst3/orDrumbox.vst3.zip orDrumbox.vst3 LICENSE LICENSE-GPL-3.0 THIRD-PARTY-LICENSES.txt vst3-NOTICE.txt)
      - name: VST3 of the release (macOS)
        if: runner.os == 'macOS'
        # The licenses go in a folder with the bundle, which `--keepParent` keeps whole.
        run: |
          mkdir -p vst3 stage
          cp -R target/bundled/orDrumbox.vst3 stage/
          cp LICENSE LICENSE-GPL-3.0 THIRD-PARTY-LICENSES.txt installer/vst3-NOTICE.txt stage/
          ditto -c -k --norsrc --noextattr --noacl stage vst3/orDrumbox.vst3.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-vst3-${{ runner.os }}
          path: vst3
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-plugin-${{ runner.os }}
          path: target/bundled

  # Built for a release tag only, or when the workflow is run by hand.
  windows-exe:
    name: ordrumbox.exe
    needs: [check, plugin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history and its tags: the program names its build from
        # them (`crates/ordrumbox-ui/build.rs`).
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ordrumbox-app
      # A release names itself by its version alone, not as a dev build.
      - name: Release build is named by its version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          build=$(target/release/ordrumbox.exe --version)
          if [ "$build" != "orDrumbox ${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME, but the program is $build"
            exit 1
          fi
      # The program, the CLAP plugin, the assets both read from the folder next
      # to them, the license.
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-clap-Windows
          path: dist
      - shell: bash
        run: cp target/release/ordrumbox.exe LICENSE THIRD-PARTY-LICENSES.txt dist/ && cp -r assets dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-windows-x64
          path: dist
      # The setup (`installer/ordrumbox.iss`), from the same `dist/`. The version comes from
      # `Cargo.toml`, so a run by hand without a tag builds one too. pwsh, not bash: Git Bash
      # would turn `/DAppVersion=…` into a path. Inno Setup is installed by Chocolatey rather
      # than taken from the runner image, which may drop it.
      - run: choco install innosetup -y --no-progress
      - name: Setup
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\ordrumbox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-windows-setup
          path: setup

  # Built for a release tag only, or when the workflow is run by hand.
  linux-app:
    name: ordrumbox (linux)
    needs: [check, plugin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history and its tags: the program names its build from
        # them (`crates/ordrumbox-ui/build.rs`).
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libx11-dev libxcb1-dev libx11-xcb-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - run: cargo build --release -p ordrumbox-app
      # A release names itself by its version alone, not as a dev build.
      - name: Release build is named by its version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          build=$(target/release/ordrumbox --version)
          if [ "$build" != "orDrumbox ${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME, but the program is $build"
            exit 1
          fi
      # The program, the CLAP plugin, the assets both read from the folder next
      # to them, the license. The zip does not bundle the system libraries the
      # binary links at run time (ALSA, X11).
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-clap-Linux
          path: clap
      # The `.desktop` file and its icon: `install -D` them under `~/.local/share/` (README.md).
      - run: mkdir -p dist && cp clap/orDrumbox.clap target/release/ordrumbox LICENSE THIRD-PARTY-LICENSES.txt installer/ordrumbox.desktop dist/ && cp installer/ordrumbox-setup.png dist/ordrumbox.png && cp -r assets dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-linux-x64
          path: dist

  release:
    name: GitHub release
    needs: [windows-exe, linux-app, macos-app, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The app compares the tag with its own version: they must be the same.
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml has version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-windows-x64
          path: ordrumbox
      - run: zip -r "ordrumbox-$GITHUB_REF_NAME-windows-x64.zip" ordrumbox
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-linux-x64
          path: ordrumbox-linux
      - run: zip -r "ordrumbox-$GITHUB_REF_NAME-linux-x64.zip" ordrumbox-linux
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-macos
          path: macos-app
      - run: mv macos-app/orDrumbox-macos.zip "ordrumbox-$GITHUB_REF_NAME-macos.zip"
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-clap-macOS
          path: clap-macos
      - run: mv clap-macos/orDrumbox.clap.zip "ordrumbox-$GITHUB_REF_NAME-macos-clap.zip"
      - run: zip -j "ordrumbox-$GITHUB_REF_NAME-macos-clap.zip" LICENSE THIRD-PARTY-LICENSES.txt
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-clap-Linux
          path: clap-linux
      - run: zip -j "ordrumbox-$GITHUB_REF_NAME-linux-clap.zip" clap-linux/orDrumbox.clap LICENSE THIRD-PARTY-LICENSES.txt
      # The VST3 zips (GPLv3), one per system.
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-vst3-Windows
          path: vst3-windows
      - run: mv vst3-windows/orDrumbox.vst3.zip "ordrumbox-$GITHUB_REF_NAME-windows-vst3.zip"
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-vst3-Linux
          path: vst3-linux
      - run: mv vst3-linux/orDrumbox.vst3.zip "ordrumbox-$GITHUB_REF_NAME-linux-vst3.zip"
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-vst3-macOS
          path: vst3-macos
      - run: mv vst3-macos/orDrumbox.vst3.zip "ordrumbox-$GITHUB_REF_NAME-macos-vst3.zip"
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-windows-setup
          path: setup
      # The notes are the version's section of CHANGELOG.md; a version without one fails the release.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{found = ($2 == v); next} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section '## $version'"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --title "orDrumbox $GITHUB_REF_NAME" --notes-file notes.md ./*.zip ./setup/*.exe
        env:
          GH_TOKEN: ${{ github.token }}

  # Built for a release tag only, or when the workflow is run by hand. The
  # icon of a macOS program comes from its `.app` bundle (`installer/`).
  macos-app:
    name: orDrumbox.app
    needs: [check, plugin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ordrumbox-app
      # The program reads `assets/` next to itself: both go in `Contents/MacOS`.
      - name: Bundle
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          app=dist/orDrumbox.app/Contents
          mkdir -p $app/MacOS $app/Resources
          cp target/release/ordrumbox $app/MacOS/
          cp -r assets $app/MacOS/
          cp installer/ordrumbox.icns $app/Resources/
          sed "s/@VERSION@/$version/g" installer/Info.plist > $app/Info.plist
          cp LICENSE THIRD-PARTY-LICENSES.txt dist/
      - run: ditto -c -k --norsrc --noextattr --noacl --keepParent dist/orDrumbox.app orDrumbox-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-macos
          path: orDrumbox-macos.zip
