name: CI

on:
  push:
    branches: [main]
    # A version tag (`v0.2.0`) also publishes a GitHub release, which the
    # app's update check (Help > Check for updates) reads.
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions > CI > Run workflow) to get a Windows build of any branch.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The plugin bundles (`assets/` inside), checked by the CLAP project's
  # validator. Built for a release tag only, or when the workflow is run by hand.
  # The CLAP is built first without `vst3`, so that the one shipped in the
  # release stays MIT (README.md, "License"); the VST3 build, GPLv3, is only an
  # artifact of the run.
  plugin:
    name: plugin (${{ matrix.os }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle ordrumbox-plugin --release
      # 0.3.2 no longer builds: its lockfile pins `time` 0.3.20, which recent
      # rustc rejects. The workflow's `-D warnings` is for this repository's
      # code: a warning in the validator's own code must not fail its build.
      - run: cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
        env:
          RUSTFLAGS: ""
      # The excluded tests fail in nih-plug's CLAP wrapper, not in this plugin:
      # its state load reserves the length read from the stream unchecked
      # (random bytes abort on the allocation), and does not ask the host to
      # rescan the parameter values afterwards.
      - run: clap-validator validate --exclude 'state-invalid-random|state-reproducibility' target/bundled/orDrumbox.clap
      # The CLAP of the release. On Windows it is a single file, which reads the
      # `assets/` next to it: the Windows zip puts it beside `ordrumbox.exe`.
      # On macOS it is a bundle, `assets/` inside, zipped by `ditto` to keep its
      # signature and the binary's permissions.
      - name: CLAP of the release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir clap && cp target/bundled/orDrumbox.clap clap/
      - name: CLAP of the release (macOS)
        if: runner.os == 'macOS'
        run: mkdir clap && ditto -c -k --norsrc --noextattr --noacl --keepParent target/bundled/orDrumbox.clap clap/orDrumbox.clap.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-clap-${{ runner.os }}
          path: clap
      - run: cargo xtask bundle ordrumbox-plugin --release --features vst3
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-plugin-${{ runner.os }}
          path: target/bundled

  # Built for a release tag only, or when the workflow is run by hand.
  windows-exe:
    name: ordrumbox.exe
    needs: [check, plugin]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history and its tags: the program names its build from
        # them (`crates/ordrumbox-ui/build.rs`).
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ordrumbox-app
      # A release names itself by its version alone, not as a dev build.
      - name: Release build is named by its version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          build=$(target/release/ordrumbox.exe --version)
          if [ "$build" != "orDrumbox ${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME, but the program is $build"
            exit 1
          fi
      # The program, the CLAP plugin, the assets both read from the folder next
      # to them, the license.
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-clap-Windows
          path: dist
      - shell: bash
        run: cp target/release/ordrumbox.exe LICENSE dist/ && cp -r assets dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-windows-x64
          path: dist
      # The setup (`installer/ordrumbox.iss`), from the same `dist/`. The version comes from
      # `Cargo.toml`, so a run by hand without a tag builds one too. pwsh, not bash: Git Bash
      # would turn `/DAppVersion=…` into a path. Inno Setup is installed by Chocolatey rather
      # than taken from the runner image, which may drop it.
      - run: choco install innosetup -y --no-progress
      - name: Setup
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\ordrumbox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-windows-setup
          path: setup

  release:
    name: GitHub release
    needs: [windows-exe, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The app compares the tag with its own version: they must be the same.
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml has version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-windows-x64
          path: ordrumbox
      - run: zip -r "ordrumbox-$GITHUB_REF_NAME-windows-x64.zip" ordrumbox
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-clap-macOS
          path: clap-macos
      - run: mv clap-macos/orDrumbox.clap.zip "ordrumbox-$GITHUB_REF_NAME-macos-clap.zip"
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-windows-setup
          path: setup
      - run: gh release create "$GITHUB_REF_NAME" --title "orDrumbox $GITHUB_REF_NAME" --generate-notes ./*.zip ./setup/*.exe
        env:
          GH_TOKEN: ${{ github.token }}
