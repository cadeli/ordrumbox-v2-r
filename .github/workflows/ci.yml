name: CI

on:
  push:
    branches: [main]
    # A version tag (`v0.2.0`) also publishes a GitHub release, which the
    # app's update check (Help > Check for updates) reads.
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions > CI > Run workflow) to get a Windows build of any branch.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The plugin bundles (CLAP and VST3, `assets/` inside), checked by the
  # CLAP project's validator. Built for a release tag only, or when the
  # workflow is run by hand.
  plugin:
    name: plugin (${{ matrix.os }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle ordrumbox-plugin --release --features vst3
      # 0.3.2 no longer builds: its lockfile pins `time` 0.3.20, which recent
      # rustc rejects. The workflow's `-D warnings` is for this repository's
      # code: a warning in the validator's own code must not fail its build.
      - run: cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
        env:
          RUSTFLAGS: ""
      # The excluded tests fail in nih-plug's CLAP wrapper, not in this plugin:
      # its state load reserves the length read from the stream unchecked
      # (random bytes abort on the allocation), and does not ask the host to
      # rescan the parameter values afterwards.
      - run: clap-validator validate --exclude 'state-invalid-random|state-reproducibility' target/bundled/orDrumbox.clap
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-plugin-${{ runner.os }}
          path: target/bundled

  # Built for a release tag only, or when the workflow is run by hand.
  windows-exe:
    name: ordrumbox.exe
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history and its tags: the program names its build from
        # them (`crates/ordrumbox-ui/build.rs`).
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ordrumbox-app
      # A release names itself by its version alone, not as a dev build.
      - name: Release build is named by its version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          build=$(target/release/ordrumbox.exe --version)
          if [ "$build" != "orDrumbox ${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME, but the program is $build"
            exit 1
          fi
      # The program, the assets it reads from the folder next to it, its license.
      - shell: bash
        run: mkdir dist && cp target/release/ordrumbox.exe LICENSE dist/ && cp -r assets dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ordrumbox-windows-x64
          path: dist

  release:
    name: GitHub release
    needs: windows-exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The app compares the tag with its own version: they must be the same.
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml has version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: ordrumbox-windows-x64
          path: ordrumbox
      - run: zip -r "ordrumbox-$GITHUB_REF_NAME-windows-x64.zip" ordrumbox
      - run: gh release create "$GITHUB_REF_NAME" --title "orDrumbox $GITHUB_REF_NAME" --generate-notes ./*.zip
        env:
          GH_TOKEN: ${{ github.token }}
