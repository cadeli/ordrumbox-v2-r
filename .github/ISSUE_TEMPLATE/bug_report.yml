name: Bug report
description: Something does not work, or sounds wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Help > About, for example 0.1.2
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Pattern, song or kit
      description: Attach the JSON file or the steps that show it, and any message the app displayed.
