[workspace]
resolver = "3"
members = ["crates/*"]
# Set aside for now (AGENTS.md): kept in the repository, built by nothing.
exclude = ["crates/ordrumbox-plugin"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/cadeli/ordrumbox-v2-r"

# The four domain crates have no third-party dependency. Only the platform
# bridges live here: window, pixel buffer, audio output (ordrumbox-app) and
# font rasteriser (ordrumbox-ui; the font itself is the system's, read at
# start).
[workspace.dependencies]
ordrumbox-core = { path = "crates/ordrumbox-core" }
ordrumbox-logic = { path = "crates/ordrumbox-logic" }
ordrumbox-dsp = { path = "crates/ordrumbox-dsp" }
ordrumbox-engine = { path = "crates/ordrumbox-engine" }
ordrumbox-ui = { path = "crates/ordrumbox-ui" }
rfd = "0.18"
winit = "0.30.13"
# Without `kms` (direct rendering on a console, with no display server): the
# windows are always X11 or Wayland ones.
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
cpal = "0.18.2"
midir = "0.11.1"
fontdue = "0.9.5"
png = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "allow"
# AGENTS.md, "Errors": `expect` and `unwrap` only for invariants (allowed
# where they are, with the reason; tests are free: clippy.toml); no report
# on stderr, which the Windows build has no console for; no `let _ =` on a
# value that must be used.
unwrap_used = "warn"
expect_used = "warn"
print_stderr = "warn"
let_underscore_must_use = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
