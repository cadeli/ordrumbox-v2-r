# Third-party licenses (`cargo about generate about.hbs > THIRD-PARTY-LICENSES.txt`,
# DEVELOPMENT.md, "Licenses"). Every target and feature the releases are built for.
accepted = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "MPL-2.0", "GPL-3.0-or-later", "CC0-1.0", "BSD-1-Clause", "0BSD", "BSL-1.0", "OFL-1.1", "LicenseRef-UFL-1.0", "Apache-2.0 WITH LLVM-exception"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
workarounds = []
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Declares "GPLv3", which is not an SPDX identifier.
[vst3-sys]
accepted = ["GPL-3.0-or-later"]
[vst3-sys.clarify]
license = "GPL-3.0-or-later"
[[vst3-sys.clarify.files]]
path = "license.md"
checksum = "1be76dd654024ee690864bea328622e912847461671cee0533ddf9a2cab4a31d"
